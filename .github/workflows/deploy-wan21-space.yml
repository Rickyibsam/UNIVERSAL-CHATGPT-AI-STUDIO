name: Deploy Wan2.1 ZeroGPU Space

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub
      - name: Publish Space source
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: \${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_ID"]
          if not token or "/" not in repo_id:
              raise SystemExit("Configure HF_TOKEN secret and HF_SPACE_ID variable first.")
          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(repo_id=repo_id, repo_type="space", folder_path="hf-space-wan21", path_in_repo=".")
          print("Wan2.1 Space source uploaded. Enable ZeroGPU in Space Settings if it is not already enabled.")
          PY
